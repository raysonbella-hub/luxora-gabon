<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXORA — Boutique</title>
<meta name="description" content="La boutique LUXORA : Pack Transformation, Gummies Collagène, Sérum Éclat, Complément Silhouette. Paiement à la livraison au Gabon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <nav class="wrap">
    <a href="index.html" class="brandmark">
      <svg viewBox="0 0 40 40" fill="none"><path d="M12 8 L12 30 L28 30" stroke="#c9a227" stroke-width="1.6"/><path d="M28 30 C 30 26, 32 24, 34 26 C 32 30, 30 32, 28 30 Z" stroke="#c9a227" stroke-width="1.2"/></svg>
      LUXORA
    </a>
    <div class="navlinks">
      <a href="index.html">Accueil</a>
      <a href="boutique.html" class="active">Boutique</a>
      <a href="panier.html" class="cart-link">Panier <span class="cart-count">0</span></a>
    </div>
  </nav>
</header>

<main>
  <section style="padding-top:70px; padding-bottom:50px;">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">La boutique</span>
        <h1>La Boutique LUXORA</h1>
        <p>Chaque produit est vendu séparément, avec son propre effet. Paiement à la livraison.</p>
      </div>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="wrap">
      <div class="grid-products" id="shop-grid"></div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap footer-grid">
    <div>
      <div class="footer-brand">
        <svg viewBox="0 0 40 40" fill="none"><path d="M12 8 L12 30 L28 30" stroke="#c9a227" stroke-width="1.6"/><path d="M28 30 C 30 26, 32 24, 34 26 C 32 30, 30 32, 28 30 Z" stroke="#c9a227" stroke-width="1.2"/></svg>
        LUXORA
      </div>
      <p class="fine" style="margin-top:10px;">L'éclat qui vous appartient.</p>
    </div>
    <div class="footer-links">
      <a href="boutique.html">Boutique</a>
      <a href="panier.html">Panier</a>
    </div>
    <p class="fine">© 2026 LUXORA. Gabon.</p>
  </div>
</footer>

<div class="added-toast" id="added-toast">Ajouté au panier ✓</div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  const ICONS = {
    triptych: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="20" y="40" width="16" height="55" rx="2"/><rect x="24" y="30" width="8" height="12" rx="1"/><rect x="52" y="30" width="16" height="65" rx="2"/><rect x="56" y="20" width="8" height="12" rx="1"/><rect x="84" y="45" width="16" height="50" rx="2"/><rect x="88" y="35" width="8" height="12" rx="1"/><line x1="10" y1="100" x2="110" y2="100" stroke-width="1"/></svg>`,
    jar: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="35" y="45" width="50" height="55" rx="6"/><rect x="30" y="35" width="60" height="14" rx="3"/><circle cx="50" cy="65" r="4" class="fill"/><circle cx="65" cy="75" r="4" class="fill"/><circle cx="72" cy="60" r="4" class="fill"/><circle cx="55" cy="85" r="4" class="fill"/></svg>`,
    dropper: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="42" y="45" width="36" height="55" rx="4"/><path d="M48 45 L48 30 L72 30 L72 45"/><rect x="52" y="14" width="16" height="18" rx="2"/><line x1="60" y1="32" x2="60" y2="50" stroke-width="1.5"/></svg>`,
    pouch: `<svg viewBox="0 0 120 120" class="picon" fill="none"><path d="M35 40 L85 40 L92 100 C92 105 88 108 82 108 L38 108 C32 108 28 105 28 100 Z"/><path d="M35 40 L40 25 L80 25 L85 40"/><path d="M50 60 C55 55 65 55 70 60 C65 68 55 68 50 60 Z"/></svg>`
  };

  const grid = document.getElementById("shop-grid");
  grid.setAttribute("data-reveal-group", "");
  Object.entries(LUXORA_PRODUCTS).forEach(([id, p]) => {
    const card = document.createElement("div");
    card.className = "product-card";
    card.setAttribute("data-reveal", "fade-up");
    const visual = p.image
      ? `<a href="produit.html?id=${id}" class="picon-wrap" style="border-radius:2px;overflow:hidden;"><img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;"></a>`
      : `<a href="produit.html?id=${id}" class="picon-wrap">${ICONS[p.icon]}</a>`;
    const brandTag = p.brand ? `<p style="text-align:center;font-size:10px;letter-spacing:0.1em;color:var(--ivory-dim);text-transform:uppercase;margin-bottom:8px;">Marque ${p.brand}</p>` : "";
    card.innerHTML = `
      ${visual}
      <h3><a href="produit.html?id=${id}">${p.name}</a></h3>
      ${brandTag}
      <p class="tagline">${p.tagline}</p>
      <p class="price"><span class="strike">${formatFCFA(p.oldPrice)}</span>${formatFCFA(p.price)}</p>
      <div class="actions">
        <a class="btn btn-primary btn-sm" href="produit.html?id=${id}">Commander</a>
        <button class="btn btn-ghost btn-sm" data-id="${id}">Ajouter au panier</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener("click", (e) => {
    if(e.target.matches("button[data-id]")){
      addToCart(e.target.dataset.id, 1);
      pulseSuccess(e.target, "Ajouté ✓");
    }
  });
</script>

<script src="js/animations.js"></script>

</body>
</html>
