<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXORA — Votre panier</title>
<meta name="description" content="Votre panier LUXORA. Paiement à la livraison au Gabon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <nav class="wrap">
    <a href="index.html" class="brandmark">
      <svg viewBox="0 0 40 40" fill="none"><path d="M12 8 L12 30 L28 30" stroke="#c9a227" stroke-width="1.6"/><path d="M28 30 C 30 26, 32 24, 34 26 C 32 30, 30 32, 28 30 Z" stroke="#c9a227" stroke-width="1.2"/></svg>
      LUXORA
    </a>
    <div class="navlinks">
      <a href="index.html">Accueil</a>
      <a href="boutique.html">Boutique</a>
      <a href="panier.html" class="active cart-link">Panier <span class="cart-count">0</span></a>
    </div>
  </nav>
</header>

<main>
  <section style="padding-top:70px;">
    <div class="wrap">
      <div class="section-head" data-reveal="fade-up">
        <span class="eyebrow">Votre commande</span>
        <h1>Panier</h1>
      </div>
      <div id="cart-content"></div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap footer-grid">
    <div>
      <div class="footer-brand">
        <svg viewBox="0 0 40 40" fill="none"><path d="M12 8 L12 30 L28 30" stroke="#c9a227" stroke-width="1.6"/><path d="M28 30 C 30 26, 32 24, 34 26 C 32 30, 30 32, 28 30 Z" stroke="#c9a227" stroke-width="1.2"/></svg>
        LUXORA
      </div>
      <p class="fine" style="margin-top:10px;">L'éclat qui vous appartient.</p>
    </div>
    <div class="footer-links">
      <a href="boutique.html">Boutique</a>
    </div>
    <p class="fine">© 2026 LUXORA. Gabon.</p>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/order-submit.js"></script>
<script>
  const ICONS = {
    triptych: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="20" y="40" width="16" height="55" rx="2"/><rect x="24" y="30" width="8" height="12" rx="1"/><rect x="52" y="30" width="16" height="65" rx="2"/><rect x="56" y="20" width="8" height="12" rx="1"/><rect x="84" y="45" width="16" height="50" rx="2"/><rect x="88" y="35" width="8" height="12" rx="1"/><line x1="10" y1="100" x2="110" y2="100" stroke-width="1"/></svg>`,
    jar: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="35" y="45" width="50" height="55" rx="6"/><rect x="30" y="35" width="60" height="14" rx="3"/><circle cx="50" cy="65" r="4" class="fill"/><circle cx="65" cy="75" r="4" class="fill"/><circle cx="72" cy="60" r="4" class="fill"/><circle cx="55" cy="85" r="4" class="fill"/></svg>`,
    dropper: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="42" y="45" width="36" height="55" rx="4"/><path d="M48 45 L48 30 L72 30 L72 45"/><rect x="52" y="14" width="16" height="18" rx="2"/><line x1="60" y1="32" x2="60" y2="50" stroke-width="1.5"/></svg>`,
    pouch: `<svg viewBox="0 0 120 120" class="picon" fill="none"><path d="M35 40 L85 40 L92 100 C92 105 88 108 82 108 L38 108 C32 108 28 105 28 100 Z"/><path d="M35 40 L40 25 L80 25 L85 40"/><path d="M50 60 C55 55 65 55 70 60 C65 68 55 68 50 60 Z"/></svg>`
  };

  function renderCartPage(){
    const cart = getCart();
    const ids = Object.keys(cart);
    const container = document.getElementById("cart-content");

    if(ids.length === 0){
      container.innerHTML = `<div class="cart-empty"><p>Votre panier est vide.</p><p style="margin-top:10px;"><a href="boutique.html">Découvrir la boutique →</a></p></div>`;
      return;
    }

    let rows = "";
    ids.forEach(id => {
      const p = LUXORA_PRODUCTS[id];
      if(!p) return;
      const qty = cart[id];
      rows += `
        <tr data-row="${id}" data-reveal="fade">
          <td>
            <div class="cart-item-name">
              <div class="cart-item-icon" style="${p.image ? 'border-radius:2px;overflow:hidden;' : ''}">${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : ICONS[p.icon]}</div>
              <div><h4>${p.name}</h4></div>
            </div>
          </td>
          <td>${formatFCFA(p.price)}</td>
          <td>
            <div class="qty-control">
              <button data-action="minus" data-id="${id}">−</button>
              <span data-qty-value="${id}">${qty}</span>
              <button data-action="plus" data-id="${id}">+</button>
            </div>
          </td>
          <td data-subtotal="${id}">${formatFCFA(p.price * qty)}</td>
          <td><button class="remove-btn" data-action="remove" data-id="${id}">Retirer</button></td>
        </tr>
      `;
    });

    const total = cartTotal();

    container.innerHTML = `
      <table class="cart-table">
        <thead><tr><th>Produit</th><th>Prix</th><th>Quantité</th><th>Sous-total</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="order-form" style="margin-left:auto;" data-reveal="fade-up">
        <h3>Passer commande</h3>
        <p class="of-sub">Pas de paiement maintenant. Vous payez seulement quand vous recevez le produit.</p>
        <div class="form-row">
          <label for="of-name">Votre nom</label>
          <input type="text" id="of-name" placeholder="Ex : Bella Obiang">
        </div>
        <div class="form-row">
          <label for="of-phone">Votre numéro de téléphone</label>
          <input type="tel" id="of-phone" placeholder="Ex : 062396718">
        </div>
        <div class="form-row">
          <label for="of-city">Votre ville</label>
          <select id="of-city">
            <option>Libreville</option>
            <option>Owendo</option>
            <option>Akanda</option>
            <option>Port-Gentil</option>
            <option>Franceville</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="order-recap">
          <span>Total</span>
          <strong id="cart-form-total">${formatFCFA(total)}</strong>
        </div>
        <button class="btn btn-primary" id="of-submit" style="font-size:15px;padding:20px 34px;">ENVOYER MA COMMANDE</button>
        <p class="form-error" id="of-error">Merci d'écrire votre nom et votre numéro de téléphone.</p>
      </div>
    `;

    document.getElementById("of-submit").addEventListener("click", async () => {
      const name = document.getElementById("of-name").value.trim();
      const phone = document.getElementById("of-phone").value.trim();
      const city = document.getElementById("of-city").value;
      const errorEl = document.getElementById("of-error");
      const btn = document.getElementById("of-submit");
      if(!name || !phone){
        errorEl.classList.add("show");
        return;
      }
      errorEl.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "ENVOI EN COURS...";

      const cartNow = getCart();
      let lines = [];
      Object.keys(cartNow).forEach(pid => {
        const p = LUXORA_PRODUCTS[pid];
        if(p) lines.push(`${p.name} x${cartNow[pid]} (${formatFCFA(p.price * cartNow[pid])})`);
      });
      lines.push(`Total : ${formatFCFA(cartTotal())}`);

      await submitOrder({
        nom: name,
        telephone: phone,
        ville: city,
        commande: lines.join(" | ")
      });

      document.querySelector(".order-form").innerHTML = `<div class="form-success"><h4>Commande envoyée ✓</h4><p>Merci ${name} ! Vous serez appelée au ${phone} pour confirmer la livraison à ${city}.</p></div>`;
    });

    if(typeof initScrollReveal === "function") initScrollReveal();

    container.querySelectorAll("button[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const cart = getCart();

        if(action === "remove"){
          const row = container.querySelector(`tr[data-row="${id}"]`);
          if(row){
            row.classList.add("removing");
            setTimeout(() => { removeFromCart(id); }, 320);
          } else {
            removeFromCart(id);
          }
          return;
        }

        let newQty = cart[id] || 0;
        if(action === "plus") newQty += 1;
        if(action === "minus") newQty -= 1;
        setQty(id, newQty);

        if(newQty <= 0){
          renderCartPage();
          return;
        }

        // Mise à jour ciblée (pas de re-rendu complet) pour garder l'animation "bump" fluide
        const qtyEl = container.querySelector(`[data-qty-value="${id}"]`);
        const subtotalEl = container.querySelector(`[data-subtotal="${id}"]`);
        const p = LUXORA_PRODUCTS[id];
        if(qtyEl){ qtyEl.textContent = newQty; if(typeof bumpElement === "function") bumpElement(qtyEl); }
        if(subtotalEl && p) subtotalEl.textContent = formatFCFA(p.price * newQty);
        const cartFormTotal = document.getElementById("cart-form-total");
        if(cartFormTotal) cartFormTotal.textContent = formatFCFA(cartTotal());
      });
    });
  }

  document.addEventListener("DOMContentLoaded", renderCartPage);
</script>

<script src="js/animations.js"></script>

</body>
</html>
