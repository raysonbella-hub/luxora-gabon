<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXORA — Votre panier</title>
<meta name="description" content="Votre panier LUXORA. Paiement à la livraison au Gabon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <nav class="wrap">
    <a href="index.html" class="brandmark">
      <svg viewBox="0 0 40 40" fill="none"><path d="M12 8 L12 30 L28 30" stroke="#c9a227" stroke-width="1.6"/><path d="M28 30 C 30 26, 32 24, 34 26 C 32 30, 30 32, 28 30 Z" stroke="#c9a227" stroke-width="1.2"/></svg>
      LUXORA
    </a>
    <div class="navlinks">
      <a href="index.html">Accueil</a>
      <a href="boutique.html">Boutique</a>
      <a href="panier.html" class="active cart-link">Panier <span class="cart-count">0</span></a>
    </div>
  </nav>
</header>

<main>
  <section style="padding-top:70px;">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">Votre commande</span>
        <h1>Panier</h1>
      </div>
      <div id="cart-content"></div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap footer-grid">
    <div>
      <div class="footer-brand">
        <svg viewBox="0 0 40 40" fill="none"><path d="M12 8 L12 30 L28 30" stroke="#c9a227" stroke-width="1.6"/><path d="M28 30 C 30 26, 32 24, 34 26 C 32 30, 30 32, 28 30 Z" stroke="#c9a227" stroke-width="1.2"/></svg>
        LUXORA
      </div>
      <p class="fine" style="margin-top:10px;">L'éclat qui vous appartient.</p>
    </div>
    <div class="footer-links">
      <a href="boutique.html">Boutique</a>
    </div>
    <p class="fine">© 2026 LUXORA. Gabon.</p>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  const ICONS = {
    triptych: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="20" y="40" width="16" height="55" rx="2"/><rect x="24" y="30" width="8" height="12" rx="1"/><rect x="52" y="30" width="16" height="65" rx="2"/><rect x="56" y="20" width="8" height="12" rx="1"/><rect x="84" y="45" width="16" height="50" rx="2"/><rect x="88" y="35" width="8" height="12" rx="1"/><line x1="10" y1="100" x2="110" y2="100" stroke-width="1"/></svg>`,
    jar: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="35" y="45" width="50" height="55" rx="6"/><rect x="30" y="35" width="60" height="14" rx="3"/><circle cx="50" cy="65" r="4" class="fill"/><circle cx="65" cy="75" r="4" class="fill"/><circle cx="72" cy="60" r="4" class="fill"/><circle cx="55" cy="85" r="4" class="fill"/></svg>`,
    dropper: `<svg viewBox="0 0 120 120" class="picon" fill="none"><rect x="42" y="45" width="36" height="55" rx="4"/><path d="M48 45 L48 30 L72 30 L72 45"/><rect x="52" y="14" width="16" height="18" rx="2"/><line x1="60" y1="32" x2="60" y2="50" stroke-width="1.5"/></svg>`,
    pouch: `<svg viewBox="0 0 120 120" class="picon" fill="none"><path d="M35 40 L85 40 L92 100 C92 105 88 108 82 108 L38 108 C32 108 28 105 28 100 Z"/><path d="M35 40 L40 25 L80 25 L85 40"/><path d="M50 60 C55 55 65 55 70 60 C65 68 55 68 50 60 Z"/></svg>`
  };

  function renderCartPage(){
    const cart = getCart();
    const ids = Object.keys(cart);
    const container = document.getElementById("cart-content");

    if(ids.length === 0){
      container.innerHTML = `<div class="cart-empty"><p>Votre panier est vide.</p><p style="margin-top:10px;"><a href="boutique.html">Découvrir la boutique →</a></p></div>`;
      return;
    }

    let rows = "";
    ids.forEach(id => {
      const p = LUXORA_PRODUCTS[id];
      if(!p) return;
      const qty = cart[id];
      rows += `
        <tr>
          <td>
            <div class="cart-item-name">
              <div class="cart-item-icon">${ICONS[p.icon]}</div>
              <div><h4>${p.name}</h4></div>
            </div>
          </td>
          <td>${formatFCFA(p.price)}</td>
          <td>
            <div class="qty-control">
              <button data-action="minus" data-id="${id}">−</button>
              <span>${qty}</span>
              <button data-action="plus" data-id="${id}">+</button>
            </div>
          </td>
          <td>${formatFCFA(p.price * qty)}</td>
          <td><button class="remove-btn" data-action="remove" data-id="${id}">Retirer</button></td>
        </tr>
      `;
    });

    const total = cartTotal();

    container.innerHTML = `
      <table class="cart-table">
        <thead><tr><th>Produit</th><th>Prix</th><th>Quantité</th><th>Sous-total</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="cart-summary">
        <div class="row"><span>Sous-total</span><span>${formatFCFA(total)}</span></div>
        <div class="row"><span>Livraison</span><span>Calculée à la confirmation</span></div>
        <div class="row total"><span>Total</span><span>${formatFCFA(total)}</span></div>
        <a class="btn btn-primary" id="checkout-btn" href="#" target="_blank" rel="noopener">Commander sur WhatsApp</a>
        <p class="cart-note">Paiement en espèces à la livraison — aucun paiement en ligne requis.</p>
      </div>
    `;

    document.getElementById("checkout-btn").href = buildWhatsAppLink();

    container.querySelectorAll("button[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const cart = getCart();
        if(action === "plus"){ setQty(id, (cart[id]||0) + 1); }
        if(action === "minus"){ setQty(id, (cart[id]||0) - 1); }
        if(action === "remove"){ removeFromCart(id); return; }
        renderCartPage();
      });
    });
  }

  document.addEventListener("DOMContentLoaded", renderCartPage);
</script>

</body>
</html>
